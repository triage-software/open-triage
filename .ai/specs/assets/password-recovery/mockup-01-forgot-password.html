<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mockup: /forgot-password (request form)</title>
<style>
  :root {
    --canvas:#faf9f6; --surface:#ffffff; --sunken:#f1f0ed; --border:#d7d6d4; --border-soft:#ecebe8;
    --ink:#2d2d2c; --ink-strong:#111111; --muted:#636261; --accent:#6b6157;
    --primary:#6b6157; --primary-hover:#453e37; --accent-bg:#ebe6dd; --accent-bg-soft:#f7f3e9;
    --symbol-bg:#ead4c4; --symbol-fg:#8c6850; --dot:#c98d68; --focus:#91887d;
  }
  * { box-sizing:border-box; margin:0; font-family:system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif; }
  .auth-page { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; background:var(--canvas); color:var(--ink); }
  .auth-brand { display:flex; flex-direction:column; justify-content:center; gap:14px; padding:48px 56px;
    background:radial-gradient(1200px 500px at -10% 110%, var(--accent-bg) 0%, transparent 60%), var(--sunken);
    border-right:1px solid var(--border); color:var(--ink-strong); }
  .auth-mark { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px;
    border-radius:8px; background:var(--symbol-bg); color:var(--symbol-fg); font-weight:700; font-size:20px; }
  .auth-brand strong { font-size:28px; font-weight:700; letter-spacing:-0.02em; }
  .auth-brand strong span { color:var(--dot); }
  .auth-brand p { max-width:34ch; color:var(--muted); font-size:14px; line-height:1.5; }
  .auth-panel { display:flex; flex-direction:column; justify-content:center; gap:16px; padding:48px; max-width:460px; width:100%; margin:0 auto; }
  .panel-top { display:flex; justify-content:flex-end; }
  .lang-toggle { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .lang-toggle button { border:0; background:transparent; padding:5px 12px; font-size:12px; cursor:pointer; color:var(--muted); }
  .lang-toggle .active { background:var(--accent-bg); color:var(--ink-strong); font-weight:600; }
  .auth-card { background:var(--surface); border:1px solid var(--border-soft); border-radius:10px;
    box-shadow:0 1px 2px rgba(69,62,55,.06), 0 4px 16px rgba(69,62,55,.07); padding:28px; }
  .auth-card h1 { font-size:20px; margin:0 0 8px; color:var(--ink-strong); letter-spacing:-0.01em; }
  .intro { font-size:13px; color:var(--muted); margin:0 0 16px; line-height:1.5; }
  .auth-form { display:flex; flex-direction:column; gap:12px; }
  .auth-form label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .auth-form input { padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:var(--surface); color:var(--ink); }
  .btn-primary { background:var(--primary); color:#fffcf0; border:0; border-radius:999px; padding:11px 22px;
    font-size:14px; font-weight:600; cursor:pointer; margin-top:4px; }
  .back { font-size:13px; color:var(--muted); text-align:center; }
  .back a { color:var(--accent); }
  .note { position:fixed; bottom:12px; right:16px; font-size:11px; color:var(--muted); opacity:.75; }
</style>
</head>
<body>
<main class="auth-page">
  <div class="auth-brand">
    <span class="auth-mark">T</span>
    <strong>open<span>·</span>triage</strong>
    <p>Shared-inbox triage for teams.</p>
  </div>
  <div class="auth-panel">
    <div class="panel-top">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button class="active">EN</button><button>PL</button>
      </div>
    </div>
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="intro">Enter your e-mail and we’ll send you a reset link.</p>
      <form class="auth-form">
        <label>
          <span>E-mail</span>
          <input type="email" value="j.kowalska@example.com" autocomplete="email" />
        </label>
        <button type="button" class="btn-primary">Send reset link</button>
      </form>
    </div>
    <p class="back"><a href="#">Back to sign in</a></p>
  </div>
</main>
<span class="note">Proposed UI — mockup, not implemented</span>
</body>
</html>
